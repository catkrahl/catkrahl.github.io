    <script>
       document.querySelectorAll(".os-animation").forEach(function(el) {
            var osAnimationClass = el.getAttribute('data-os-animation');
            var osAnimationDelay = el.getAttribute('data-os-animation-delay');

            el.style.webkitAnimationDelay = osAnimationDelay;
            el.style.mozAnimationDelay = osAnimationDelay;
            el.style.animationDelay = osAnimationDelay;

            el.classList.add("animated");
            el.classList.add(osAnimationClass);
        });
        $('.bxslider').bxSlider();
    </script>

    <script>
        // toogle lang-dropdown
        function langSelect() {
            var element = document.getElementById("droplist");
            element.classList.toggle("show");
        }
  
        // Close the dropdown-lang menu if the user clicks outside
        window.onclick = function(event) {
            if (!event.target.matches('.drop-btn')) {
                var dropdowns = document.getElementsByClassName("dropdown-lang");
                var i;
                    for (i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
